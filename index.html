<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ground Up Cafe</title>
<style>
  :root {
    color-scheme: light;
    --bg: #eaf4fc; --panel: #ffffff; --line: #b9d4ea; --text: #12304a; --muted: #4f6f8a;
    --accent: #2f8fd8; --accent-ink: #ffffff; --selected: #d5eafa; --ph: #8aa6bd; --err: #d64545;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1c28; --panel: #172838; --line: #2c4660; --text: #e4f0fa; --muted: #93b0c8;
      --accent: #4aa6ea; --accent-ink: #08202f; --selected: #1d3a52; --ph: #6a869e; --err: #ef6b6b;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1c28; --panel: #172838; --line: #2c4660; --text: #e4f0fa; --muted: #93b0c8;
    --accent: #4aa6ea; --accent-ink: #08202f; --selected: #1d3a52; --ph: #6a869e; --err: #ef6b6b;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; line-height: 1.5; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 10px; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 1.05rem; }
  label, .label { display: block; color: var(--muted); margin: 0 0 10px; font-size: .95rem; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 26px; }
  .chip { display: flex; align-items: center; gap: 10px; flex: 1 1 calc(33% - 10px); min-width: 140px;
    padding: 13px 14px; background: transparent; color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; font: inherit; font-size: 1.05rem; cursor: pointer; transition: background .15s, border-color .15s; }
  .chip svg { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .chip:hover { background: var(--panel); }
  .chip[aria-pressed="true"] { background: var(--selected); border-color: var(--accent); }
  .chip[aria-pressed="true"] svg { color: var(--accent); }
  textarea, input[type="text"] { width: 100%; padding: 14px 16px; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 1.05rem; }
  textarea { min-height: 150px; resize: vertical; }
  ::placeholder { color: var(--ph); }
  .field { margin-bottom: 22px; }
  .starters { margin-bottom: 22px; }
  .starters button { display: block; width: 100%; text-align: left; padding: 14px 0; background: none; color: var(--muted);
    border: 0; border-top: 1px solid var(--line); font: inherit; font-size: 1.05rem; cursor: pointer; }
  .starters button:last-child { border-bottom: 1px solid var(--line); }
  .starters button:hover { color: var(--text); }
  .send { width: 100%; padding: 16px; margin-top: 4px; background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 10px; font: inherit; font-size: 1.15rem; font-weight: 600; cursor: pointer; }
  .send:disabled { opacity: .6; cursor: wait; }
  .reply { margin-top: 22px; padding: 16px 18px; background: var(--panel); border: 1px solid var(--line);
    border-left: 4px solid var(--accent); border-radius: 10px; white-space: pre-wrap; display: none; }
  .reply.error { border-left-color: var(--err); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 480px) { .chip { flex: 1 1 calc(50% - 10px); } h1 { font-size: 1.7rem; } }
</style>
</head>
<body>
<main class="wrap">
  <h1 id="title"></h1>
  <p class="sub">Write like a real customer. One of our AI staff will answer you live.</p>

  <div class="field">
    <label for="name">Your name</label>
    <input type="text" id="name" placeholder="Your name">
  </div>

  <div class="label" id="channelLabel">Which way do you want to message?</div>
  <div class="chips" role="group" aria-labelledby="channelLabel" id="chips">
    <button class="chip" type="button" data-channel="calls" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>Calls
    </button>
    <button class="chip" type="button" data-channel="whatsapp" aria-pressed="true">
      <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.7 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/></svg>WhatsApp
    </button>
    <button class="chip" type="button" data-channel="email" aria-pressed="false">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Email
    </button>
    <button class="chip" type="button" data-channel="instagram" aria-pressed="false">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></svg>Instagram
    </button>
    <button class="chip" type="button" data-channel="reviews" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6L12 16.7 6.6 19.6l1.1-6L3.2 9.4l6.1-.8z"/></svg>Reviews
    </button>
  </div>

  <div class="field">
    <label for="message">Your message</label>
    <textarea id="message" placeholder="English"></textarea>
  </div>

  <div class="starters" id="starters">
    <div class="label">Or tap one to start</div>
    <button type="button">Hi, can I book a table for 6 people tomorrow at 8 PM?</button>
    <button type="button">Can we host a coffee brewing workshop for 15 people?</button>
    <button type="button">What do you have in desserts?</button>
    <button type="button">What is the price of cold brew? I would like to order 10 bottles for our office.</button>
  </div>

  <button class="send" id="send" type="button"></button>
  <div class="reply" id="reply" role="status" aria-live="polite"></div>
</main>

<script>
  const CAFE_NAME = "Ground Up Cafe";
  const WEBHOOK_URL = "const WEBHOOK_URL = "PASTE_YOUR_WEBHOOK_URL_HERE";";

  document.title = CAFE_NAME;
  document.getElementById("title").textContent = "Message " + CAFE_NAME;
  const SEND_LABEL = "Send to " + CAFE_NAME;
  document.getElementById("send").textContent = SEND_LABEL;

  let channel = "whatsapp";
  const chips = document.querySelectorAll(".chip");
  const message = document.getElementById("message");
  const nameInput = document.getElementById("name");
  const sendBtn = document.getElementById("send");
  const replyBox = document.getElementById("reply");

  chips.forEach(chip => chip.addEventListener("click", () => {
    channel = chip.dataset.channel;
    chips.forEach(c => c.setAttribute("aria-pressed", String(c === chip)));
  }));

  document.querySelectorAll("#starters button").forEach(btn => btn.addEventListener("click", () => {
    message.value = btn.textContent;
    message.focus();
  }));

  function showReply(text, isError) {
    replyBox.className = "reply" + (isError ? " error" : "");
    replyBox.style.display = "block";
    replyBox.textContent = text;
  }

  function pickReply(data) {
    if (typeof data === "string") return data;
    if (Array.isArray(data)) data = data[0];
    if (data && typeof data === "object") {
      return data.output || data.reply || data.text || data.message || JSON.stringify(data);
    }
    return String(data);
  }

  sendBtn.addEventListener("click", async () => {
    const text = message.value.trim();
    if (!text) { showReply("Please type a message first.", true); return; }
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending...";
    showReply("Waiting for a reply...", false);
    try {
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, channel: channel, name: nameInput.value.trim() })
      });
      if (!res.ok) throw new Error("Server returned " + res.status);
      const raw = await res.text();
      let data;
      try { data = JSON.parse(raw); } catch (e) { data = raw; }
      showReply(pickReply(data), false);
    } catch (err) {
           showReply("Could not reach the cafe: " + err.message, true);
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = SEND_LABEL;
    }
  });
</script>
</body>
</html>
